# MCC-OPD: Qwen3-8B → Qwen3-1.7B，LoCoMo140，论文主配置。
defaults:
  - ppo_trainer
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

data:
  train_files: data/locomo/train.parquet
  val_files: data/locomo/val.parquet
  train_batch_size: 16
  max_prompt_length: 28672
  max_response_length: 4096
  truncation: error
  seed: 45
  apply_chat_template_kwargs:
    enable_thinking: false

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-1.7B
    trust_remote_code: true
    use_remove_padding: false
    use_fused_kernels: false
    enable_gradient_checkpointing: true
    override_config:
      attn_implementation: sdpa
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    use_dynamic_bsz: false
    loss_agg_mode: token-mean
    entropy_coeff: 0.0
    use_kl_loss: false
    optim:
      lr: 2.0e-6
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.1
      lr_scheduler_type: constant
      weight_decay: 0.01
      betas: [0.9, 0.999]
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      use_torch_compile: false
      allow_bf16_reduced_precision_reduction: false
      seed: 45
      ulysses_sequence_parallel_size: 1
      pad_to_length: false
  rollout:
    name: vllm
    n: 4
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    seed: 45
    tensor_model_parallel_size: 1
    log_prob_use_dynamic_bsz: false
    log_prob_micro_batch_size_per_gpu: 1
    calculate_log_probs: true
    gpu_memory_utilization: 0.6
    max_model_len: 32768
    max_num_batched_tokens: 8192
    max_num_seqs: 128
    agent:
      num_workers: 8
    val_kwargs:
      do_sample: false
      n: 1
      temperature: 0.0

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  rollout_correction: null

critic:
  enable: false

distillation:
  enabled: true
  n_gpus_per_node: 0
  nnodes: 0
  teacher_models:
    teacher_model:
      model_path: Qwen/Qwen3-8B
      keep_on_gpu_during_update: false
  distillation_loss:
    loss_mode: mcc_opd
    topk: 64
    alpha: 1.5
    chunked_topk_chunk_size: 128
    response_only: true
    use_policy_gradient: false
    use_task_rewards: false
    loss_max_clamp: null
    log_prob_min_clamp: null

# 仅用于训练内验证；MCC-OPD 的训练目标不使用答案 reward。
reward:
  custom_reward_function:
    path: validation.py
    name: compute_score
  num_workers: 8

trainer:
  use_v1: true
  nnodes: 1
  n_gpus_per_node: 8
  total_epochs: 3
  total_training_steps: null
  project_name: mcc_opd
  experiment_name: locomo140_n4
  logger: [console]
  resume_mode: disable
  val_before_train: false
  save_freq: 9
  test_freq: 9
  max_actor_ckpt_to_keep: null
  default_local_dir: outputs/${trainer.experiment_name}/checkpoints
  validation_data_dir: outputs/${trainer.experiment_name}/validation
  v1:
    trainer_mode: sync
    sync:
      complete_training_batch: true
      parameter_sync_step: 1

ray_kwargs:
  ray_init:
    address: local
    num_cpus: 64
    include_dashboard: false
